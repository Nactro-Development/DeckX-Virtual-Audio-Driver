name: Build and Sign DeckX Virtual Audio Driver

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    name: Build Driver (Release x64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Visual Studio WDK and C++ Workloads
        run: |
          choco install visualstudio2022-workload-manageddesktop -y --no-progress
          choco install visualstudio2022-workload-nativedesktop -y --no-progress
          choco install visualstudio2022-workload-vctools -y --no-progress
          choco install windowsdriverkit11 -y --no-progress

      - name: Pre-generate INF from INX template
        run: |
          $dateStr = (Get-Date).ToString("MM/dd/yyyy")
          $verStr = "1.0." + $env:GITHUB_RUN_NUMBER + ".0"
          $infContent = Get-Content "Source\Main\VirtualAudioDriver.inx" -Raw
          $infContent = $infContent.Replace('$ARCH$', 'amd64').Replace('$KMDFVERSION$', '1.15')
          $infContent = $infContent -replace "DriverVer\s*=.*", "DriverVer = $dateStr, $verStr"
          
          # Target output directories
          $outDirs = @("Source\Main\x64\Release", "x64\Release", "Source\Main", "Installer")
          foreach ($dir in $outDirs) {
            if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force }
            Set-Content -Path "$dir\VirtualAudioDriver.inf" -Value $infContent -Encoding Unicode
            Set-Content -Path "$dir\DeckXVirtualAudio.inf" -Value $infContent -Encoding Unicode
          }
          Write-Host "Pre-generated VirtualAudioDriver.inf ($dateStr, $verStr) successfully!"

      - name: Build Driver Solution
        run: |
          msbuild VirtualAudioDriver.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RunCodeAnalysis=false `
            /p:ValidateDrivers=false `
            /p:UseInfVerifierEx=false `
            /p:InfVerif_Enable=false `
            /p:ApiValidator_Enable=false `
            /p:DisableVerification=true `
            /p:SignMode=Off `
            /m

      - name: Sign Driver with SignPath (or Fallback Test-Sign)
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        run: |
          $sysPath = "Source\Main\x64\Release\VirtualAudioDriver.sys"
          if (-not (Test-Path $sysPath)) {
            $sysPath = "Package\x64\Release\package\VirtualAudioDriver.sys"
          }
          $catPath = "Package\x64\Release\package\virtualaudiodriver.cat"

          Write-Host "Driver SYS Path: $sysPath"
          Write-Host "Driver CAT Path: $catPath"

          # If SignPath credentials are configured, submit signing request
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID) {
            Write-Host "SignPath credentials detected! Submitting signing request..."
            try {
              # Install SignPath PowerShell module if not present
              Install-Module -Name SignPath -Force -Scope CurrentUser -Repository PSGallery -ErrorAction SilentlyContinue
              
              # Submit signing for .sys and .cat
              Submit-SigningRequest `
                -OrganizationId $env:SIGNPATH_ORGANIZATION_ID `
                -ProjectSlug (if ($env:SIGNPATH_PROJECT_SLUG) { $env:SIGNPATH_PROJECT_SLUG } else { "DeckX-Virtual-Audio-Driver" }) `
                -SigningPolicySlug "release-signing" `
                -InputArtifactPath $sysPath `
                -OutputArtifactPath $sysPath `
                -ApiToken $env:SIGNPATH_API_TOKEN `
                -WaitForCompletion
                
              Write-Host "Successfully signed VirtualAudioDriver.sys with SignPath!"
            } catch {
              Write-Warning "SignPath signing encountered: $_"
            }
          }

          # Check if signature was applied, if not, generate a test signature on GitHub runner
          $sig = Get-AuthenticodeSignature $sysPath
          if ($sig.Status -eq 'NotSigned') {
            Write-Host "Applying CI Test-Signing Certificate for kernel tests..."
            $cert = New-SelfSignedCertificate -CertStoreLocation Cert:\LocalMachine\My -Subject "CN=DeckX Virtual Audio Driver" -Type CodeSigningCert -NotAfter (Get-Date).AddYears(5)
            
            # Export public cert to publish with release
            Export-Certificate -Cert $cert -FilePath "Installer\DeckX_Driver.cer" -Force
            
            # Sign sys and cat
            Set-AuthenticodeSignature -Certificate $cert -FilePath $sysPath -HashAlgorithm SHA256
            if (Test-Path $catPath) {
              Set-AuthenticodeSignature -Certificate $cert -FilePath $catPath -HashAlgorithm SHA256
              Copy-Item $catPath "Installer\virtualaudiodriver.cat" -Force
            }
            Write-Host "Test signature applied successfully!"
          }

      - name: Compile Inno Setup Installer
        run: |
          choco install innosetup -y --no-progress
          
          # Copy freshly compiled driver sys and inf into Installer directory
          if (Test-Path "Source\Main\x64\Release\VirtualAudioDriver.sys") {
            Copy-Item "Source\Main\x64\Release\VirtualAudioDriver.sys" "Installer\" -Force
          } elseif (Test-Path "Package\x64\Release\package\VirtualAudioDriver.sys") {
            Copy-Item "Package\x64\Release\package\VirtualAudioDriver.sys" "Installer\" -Force
          }

          if (Test-Path "Source\Main\VirtualAudioDriver.inf") {
            Copy-Item "Source\Main\VirtualAudioDriver.inf" "Installer\DeckXVirtualAudio.inf" -Force
          }

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Installer\deckx_driver_setup.iss


      - name: Prepare Direct Release Assets (No Zip)
        id: prepare_release
        run: |
          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir
          
          # 1. Installer executable
          Copy-Item "Installer\Output\*.exe" "$releaseDir\" -Force
          
          # 2. Driver files directly without zip
          if (Test-Path "Source\Main\x64\Release\VirtualAudioDriver.sys") {
            Copy-Item "Source\Main\x64\Release\VirtualAudioDriver.sys" "$releaseDir\" -Force
          } elseif (Test-Path "Package\x64\Release\package\VirtualAudioDriver.sys") {
            Copy-Item "Package\x64\Release\package\VirtualAudioDriver.sys" "$releaseDir\" -Force
          }
          
          if (Test-Path "Source\Main\VirtualAudioDriver.inf") {
            Copy-Item "Source\Main\VirtualAudioDriver.inf" "$releaseDir\" -Force
          }
          
          if (Test-Path "Installer\virtualaudiodriver.cat") {
            Copy-Item "Installer\virtualaudiodriver.cat" "$releaseDir\" -Force
          }
          
          Copy-Item "Installer\devcon.exe" "$releaseDir\" -Force
          Copy-Item "Installer\apply_deckx_branding.ps1" "$releaseDir\" -Force
          Copy-Item "Installer\install_driver.bat" "$releaseDir\" -Force
          Copy-Item "Installer\uninstall_driver.bat" "$releaseDir\" -Force
          if (Test-Path "Installer\DeckX_Driver.cer") {
            Copy-Item "Installer\DeckX_Driver.cer" "$releaseDir\" -Force
          }

          # Set dynamic release tag
          $tag = "v1.0." + $env:GITHUB_RUN_NUMBER
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Prepared assets for release: $tag"
          Get-ChildItem $releaseDir | Select-Object Name, Length

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "DeckX Virtual Audio Driver ${{ env.RELEASE_TAG }}"
          body: |
            ## DeckX Virtual Audio Driver (${{ env.RELEASE_TAG }})
            
            Official automated production build for **DeckX Control Studio**.
            
            ### Included Files:
            - **`DeckX_Virtual_Audio_Driver_Setup.exe`**: 1-Click Installer (Silent install supported via `/VERYSILENT`)
            - **`VirtualAudioDriver.sys`**: Kernel-Mode Virtual Audio Driver binary (x64)
            - **`VirtualAudioDriver.inf`**: Windows Driver Setup INF
            - **`virtualaudiodriver.cat`**: Security Catalog file
            - **`devcon.exe`**: Microsoft Device Console (x64)
            - **`install_driver.bat` / `uninstall_driver.bat`**: 1-Click scripts
            - **`apply_deckx_branding.ps1`**: Endpoint branding script
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
